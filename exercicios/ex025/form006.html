<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs formulários</title>
</head>
<body>
    <form action="cadastro.php" method="post">
        <p>
            <label for="icor">Escolha uma cor</label>
            <input type="color" name="cor" id="icor" value="#00ff00">
        </p>
        <p>
            <label for="isas">Grau de satisfação</label>
            <input type="range" name="sas" id="isas" min="1" max="5" value="4">
        </p>

        <p>
            <label for="ifile">Envie seu documento</label>
            <input type="file" name="file" id="ifile">

        </p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
